services:
  postgres:
    image: postgres:16-alpine
    container_name: ntro-eda-delivery-postgres
    restart: unless-stopped
    network_mode: bridge
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ntro_eda_delivery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ntro_eda_delivery_pgdata:
    name: ntro_eda_delivery_pgdata
